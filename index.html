<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo de la Rentrée</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --grad-start: #f7dfa8;
    --grad-mid: #eeae4d;
    --grad-end: #8a4e1f;
    --cell-bg: #fffaf0;
    --cell-checked: #7a3410;
    --cell-checked-text: #f0d19f;
    --text-dark: #5c3a1a;
    --title-color: #7a3410;
    --shadow: 0 8px 32px rgba(90, 54, 18, 0.22);
    --cell-radius: 0px;
    --ruled-line: rgba(74, 122, 168, 0.16);
    --margin-line: rgba(196, 45, 45, 0.28);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    position: relative;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #fdf3dc 0%, #f7dfa8 22%, #eeae4d 55%, #c97a2b 80%, #6b3f1d 100%);
    font-family: 'DM Sans', sans-serif;
    padding: 20px;
    overflow-x: hidden;
  }

  /* Notebook paper ruled lines + red margin, evoking the back-to-school cahier */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 29px,
      var(--ruled-line) 29px,
      var(--ruled-line) 30px
    );
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    top: 0;
    bottom: 0;
    left: 42px;
    width: 2px;
    background: var(--margin-line);
    pointer-events: none;
    z-index: 0;
  }

  /* Coffee ring stains, evoking breakfast */
  .coffee-stain {
    position: fixed;
    border-radius: 50%;
    border: 6px solid rgba(107, 63, 29, 0.12);
    pointer-events: none;
    z-index: 0;
  }
  .coffee-stain.one { width: 140px; height: 140px; top: 8%; right: 6%; }
  .coffee-stain.two { width: 90px; height: 90px; bottom: 10%; left: 8%; }

  #entry-screen, #bingo-screen { position: relative; z-index: 1; }

  /* Entry screen */
  #entry-screen {
    width: 100%;
    max-width: 480px;
    text-align: center;
    animation: fadeIn 0.6s ease;
  }

  #entry-screen h1 {
    font-family: 'Dela Gothic One', cursive;
    font-size: clamp(1.8rem, 5.6vw, 3.2rem);
    color: var(--title-color);
    margin-bottom: 6px;
    text-shadow: 0 2px 12px rgba(122,52,16,0.18);
  }

  .floating-emojis {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .floating-emojis span {
    position: absolute;
    display: inline-block;
    filter: drop-shadow(0 4px 8px rgba(90,54,18,0.22));
    opacity: 0.92;
  }

  .entry-content {
    position: relative;
    z-index: 1;
  }

  #entry-screen p {
    color: var(--text-dark);
    font-size: 1.1rem;
    margin-bottom: 28px;
    opacity: 0.85;
  }

  .card-select-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 10px;
    max-width: 480px;
    margin: 0 auto;
  }

  .card-select-btn {
    background: rgba(255,250,240,0.88);
    border: 2px solid rgba(122,52,16,0.18);
    border-radius: 12px;
    padding: 12px 6px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--text-dark);
    cursor: pointer;
    transition: all 0.2s ease;
    backdrop-filter: blur(4px);
  }

  .card-select-btn:hover {
    background: var(--cell-checked);
    color: var(--cell-checked-text);
    border-color: var(--cell-checked);
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(122,52,16,0.35);
  }

  .card-select-btn .lock-owner {
    display: block;
    font-size: 0.62rem;
    font-weight: 600;
    margin-top: 2px;
    opacity: 0.85;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-select-btn.mine {
    background: var(--cell-checked);
    color: var(--cell-checked-text);
    border-color: var(--cell-checked);
  }

  .card-select-btn.taken {
    background: rgba(122,52,16,0.08);
    border-color: rgba(122,52,16,0.1);
    color: rgba(92,58,26,0.5);
    cursor: not-allowed;
  }

  .card-select-btn.taken:hover {
    background: rgba(122,52,16,0.08);
    color: rgba(92,58,26,0.5);
    border-color: rgba(122,52,16,0.1);
    transform: none;
    box-shadow: none;
  }

  .player-name-label {
    font-size: 0.85rem;
    color: var(--text-dark);
    opacity: 0.75;
    margin-top: -18px;
    margin-bottom: 20px;
  }

  .player-name-label button {
    background: none;
    border: none;
    color: var(--title-color);
    font-weight: 700;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }

  /* Name entry modal */
  .name-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1100;
    align-items: center;
    justify-content: center;
    background: rgba(58,31,8,0.55);
    padding: 20px;
  }

  .name-modal.show {
    display: flex;
  }

  .name-modal-card {
    background: #fffaf0;
    border-radius: 18px;
    padding: 28px 24px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  }

  .name-modal-card h3 {
    font-family: 'Dela Gothic One', cursive;
    font-size: 1.3rem;
    color: var(--title-color);
    margin-bottom: 8px;
  }

  .name-modal-card p {
    font-size: 0.9rem;
    color: var(--text-dark);
    opacity: 0.85;
    margin-bottom: 16px;
  }

  .name-modal-card input {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 2px solid rgba(122,52,16,0.25);
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    margin-bottom: 14px;
    text-align: center;
    color: var(--text-dark);
  }

  .name-modal-card input:focus {
    outline: none;
    border-color: var(--title-color);
  }

  .name-modal-card .btn-confirm {
    background: var(--cell-checked);
    color: var(--cell-checked-text);
    border: none;
    border-radius: 10px;
    padding: 10px 24px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }

  /* Bingo card screen */
  #bingo-screen {
    display: none;
    width: 100%;
    max-width: 540px;
    animation: slideUp 0.5s ease;
  }

  .bingo-header {
    text-align: center;
    margin-bottom: 16px;
  }

  .bingo-header h1 {
    font-family: 'Dela Gothic One', cursive;
    font-size: clamp(1.5rem, 4.8vw, 2.6rem);
    color: var(--title-color);
    text-shadow: 0 2px 12px rgba(122,52,16,0.16);
    line-height: 1.1;
  }

  .bingo-header .card-id {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: rgba(122,52,16,0.6);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }

  .bingo-card {
    background: linear-gradient(180deg, var(--grad-start), var(--grad-end));
    border-radius: 18px;
    padding: 6px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .bingo-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }

  .bingo-cell {
    background: var(--cell-bg);
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    font-size: clamp(0.62rem, 2.1vw, 0.84rem);
    font-weight: 600;
    color: var(--text-dark);
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: var(--cell-radius);
    line-height: 1.2;
    word-break: break-word;
    hyphens: none;
    overflow: hidden;
  }

  .bingo-cell:hover:not(.checked) {
    background: #fff3d6;
    transform: scale(1.03);
  }

  .bingo-cell.checked {
    background: var(--cell-checked);
    color: var(--cell-checked-text);
    transform: scale(0.97);
  }

  .bingo-cell.checked::after {
    content: '✓';
    position: absolute;
    top: 4px;
    right: 6px;
    font-size: 0.7rem;
    opacity: 0.75;
  }

  /* Bingo win animation */
  .bingo-cell.win-cell {
    animation: winPulse 0.6s ease infinite alternate;
    background: #f2a33d !important;
    color: #3a1f08 !important;
  }

  @keyframes winPulse {
    from { transform: scale(0.97); }
    to { transform: scale(1.04); box-shadow: 0 0 20px rgba(242, 163, 61, 0.6); }
  }

  .win-banner {
    display: none;
    text-align: center;
    margin-top: 20px;
    animation: bounceIn 0.6s ease;
  }

  .win-banner.show {
    display: block;
  }

  .win-banner h2 {
    font-family: 'Dela Gothic One', cursive;
    font-size: 2.4rem;
    color: #f2a33d;
    text-shadow: 0 2px 15px rgba(242,163,61,0.45);
    letter-spacing: 2px;
  }

  .win-banner p {
    color: rgba(255,250,240,0.9);
    margin-top: 4px;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .btn {
    background: rgba(255,255,255,0.22);
    border: 2px solid rgba(255,255,255,0.38);
    border-radius: 12px;
    padding: 10px 20px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    color: #fff8e8;
    cursor: pointer;
    transition: all 0.2s;
    backdrop-filter: blur(4px);
  }

  .btn:hover {
    background: rgba(255,255,255,0.36);
    transform: translateY(-1px);
  }

  /* Emoji confetti */
  .confetti-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }

  .confetti {
    position: absolute;
    top: -30px;
    opacity: 0;
    font-size: 1.6rem;
    animation: confettiFall 3s ease-in forwards;
  }

  @keyframes confettiFall {
    0% { opacity: 1; transform: translateY(0) rotate(0deg); }
    100% { opacity: 0; transform: translateY(100vh) rotate(360deg); }
  }

  /* King Kong takeover */
  .kingkong-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    pointer-events: none;
    opacity: 0;
    overflow: hidden;
    background: radial-gradient(circle at center, rgba(58,31,8,0.65) 0%, rgba(20,10,5,0.75) 100%);
    animation: kingkongOverlayFade 7s ease forwards;
  }

  .kingkong-stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Phase 1: a stampede of small King Kongs sweeps across the screen */
  .kingkong-wave {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  .kingkong-wave span {
    position: absolute;
    left: 0;
    opacity: 0;
    animation-name: kingkongWave;
    animation-timing-function: ease-in-out;
    animation-fill-mode: forwards;
    filter: drop-shadow(0 6px 10px rgba(0,0,0,0.5));
  }

  @keyframes kingkongWave {
    0%   { transform: translate(-170vw, 0) scale(0.8) rotate(-8deg); opacity: 0; }
    6%   { opacity: 1; }
    50%  { transform: translate(0vw, -10px) scale(1) rotate(4deg); opacity: 1; }
    94%  { opacity: 1; }
    100% { transform: translate(170vw, 0) scale(0.85) rotate(10deg); opacity: 0; }
  }

  /* Phase 2: the big King Kong arrives, carried in by the wave */
  .kingkong-big-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .kingkong-big {
    display: block;
    font-size: min(46vh, 36vw);
    line-height: 1;
    transform: scale(0);
    animation: kingkongPop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 1s forwards;
    filter: drop-shadow(0 14px 34px rgba(0,0,0,0.6));
  }

  .kingkong-text {
    display: block;
    font-family: 'Dela Gothic One', cursive;
    font-size: clamp(1.6rem, 6.5vw, 3.2rem);
    color: #f2a33d;
    text-shadow: 0 3px 16px rgba(0,0,0,0.5);
    letter-spacing: 2px;
    margin-top: 6px;
    opacity: 0;
    animation:
      kingkongTextIn 0.4s ease 1.7s forwards,
      kingkongTextShake 0.5s ease 2.1s 3;
  }

  @keyframes kingkongPop {
    0% { transform: scale(0) rotate(-20deg); }
    60% { transform: scale(1.18) rotate(6deg); }
    80% { transform: scale(0.95) rotate(-3deg); }
    100% { transform: scale(1.05) rotate(0deg); }
  }

  @keyframes kingkongTextIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes kingkongTextShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  /* Phase 3: the small King Kongs circle clockwise around the big one */
  .kingkong-orbit-wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    z-index: 1;
    opacity: 0;
    animation:
      kingkongOrbitIn 0.6s ease 3.4s forwards,
      kingkongOrbitSpin 3s linear 3.4s infinite;
  }

  @keyframes kingkongOrbitIn {
    to { opacity: 1; }
  }

  @keyframes kingkongOrbitSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .kingkong-orbit-item {
    position: absolute;
    top: 0;
    left: 0;
  }

  .kingkong-orbit-item span {
    display: inline-block;
    font-size: 2.4rem;
    transform: translate(-50%, -50%);
    animation: kingkongOrbitCounterSpin 3s linear 3.4s infinite;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }

  @keyframes kingkongOrbitCounterSpin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(-360deg); }
  }

  @keyframes kingkongOverlayFade {
    0%   { opacity: 0; }
    5%   { opacity: 1; }
    93%  { opacity: 1; }
    100% { opacity: 0; }
  }

  .bingo-card.kingkong-shake {
    animation: kingkongShake 0.6s ease;
  }

  @keyframes kingkongShake {
    0%, 100% { transform: translate(0, 0); }
    20% { transform: translate(-6px, 3px); }
    40% { transform: translate(6px, -3px); }
    60% { transform: translate(-4px, 2px); }
    80% { transform: translate(4px, -2px); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes bounceIn {
    0% { opacity: 0; transform: scale(0.5); }
    60% { transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* Responsive */
  @media (max-width: 400px) {
    .bingo-grid { gap: 3px; }
    .bingo-card { padding: 4px; border-radius: 14px; }
    .bingo-cell { padding: 4px; font-size: 0.6rem; }
    body::after { left: 20px; }
  }
</style>
</head>

<div class="coffee-stain one"></div>
<div class="coffee-stain two"></div>

<div id="entry-screen">
  <div class="floating-emojis" aria-hidden="true">
    <span style="top:8%; left:6%; font-size:2.4rem; transform:rotate(-15deg);">🥐</span>
    <span style="top:14%; right:9%; font-size:2rem; transform:rotate(10deg);">☕</span>
    <span style="top:38%; left:4%; font-size:1.8rem; transform:rotate(-8deg);">📚</span>
    <span style="bottom:22%; left:10%; font-size:2.2rem; transform:rotate(20deg);">✏️</span>
    <span style="bottom:10%; right:7%; font-size:2.6rem; transform:rotate(-10deg);">🎒</span>
    <span style="top:20%; left:22%; font-size:1.4rem; transform:rotate(12deg);">🍎</span>
    <span style="top:6%; right:28%; font-size:1.6rem; transform:rotate(-6deg);">🥯</span>
    <span style="bottom:30%; right:20%; font-size:1.5rem; transform:rotate(15deg);">📐</span>
    <span style="top:60%; left:5%; font-size:1.7rem; transform:rotate(-12deg);">🧃</span>
    <span style="top:50%; right:5%; font-size:1.9rem; transform:rotate(8deg);">🖍️</span>
    <span style="bottom:6%; left:30%; font-size:2rem; transform:rotate(-5deg);">🍳</span>
    <span style="top:4%; left:42%; font-size:1.6rem; transform:rotate(6deg);">🎓</span>
    <span style="bottom:40%; left:2%; font-size:1.3rem; transform:rotate(18deg);">🥞</span>
    <span style="top:70%; right:15%; font-size:1.4rem; transform:rotate(-14deg);">📓</span>
  </div>
  <div class="entry-content">
    <h1>Bingo de la Rentrée</h1>
    <p>Choisis ta grille pour commencer</p>
    <p class="player-name-label" id="playerNameLabel"></p>
    <div class="card-select-grid" id="cardSelectGrid"></div>
  </div>
</div>

<div id="bingo-screen">
  <div class="bingo-header">
    <h1>Bingo de la Rentrée 🥐</h1>
    <div class="card-id" id="cardIdLabel"></div>
  </div>
  <div class="bingo-card">
    <div class="bingo-grid" id="bingoGrid"></div>
  </div>
  <div class="win-banner" id="winBanner">
    <h2>🎉 BINGO ! 🎉</h2>
    <p>Tu as complété une ligne !</p>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="resetCard()">🔄 Réinitialiser</button>
    <button class="btn" onclick="goBack()">← Changer de grille</button>
  </div>
</div>

<div class="name-modal" id="nameModal">
  <div class="name-modal-card">
    <h3>C'est qui ?</h3>
    <p>Entre ton prénom pour verrouiller une grille rien que pour toi.</p>
    <input type="text" id="nameInput" placeholder="Ton prénom" maxlength="30" onkeydown="if(event.key==='Enter') confirmName();">
    <br>
    <button class="btn-confirm" onclick="confirmName()">Valider</button>
  </div>
</div>

<div class="name-modal" id="infoModal">
  <div class="name-modal-card">
    <h3 id="infoModalTitle">Oups !</h3>
    <p id="infoModalMessage"></p>
    <button class="btn-confirm" onclick="closeInfoModal()">OK</button>
  </div>
</div>

<div class="confetti-container" id="confettiContainer"></div>

// ===== Grid locking (Supabase) =====
const SUPABASE_URL = 'https://fqpuguazxqatcelppssr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ng7lkPOSeOiw_AaYXlfpeQ_C1JwoKEs';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let playerName = localStorage.getItem('bingoRentreePlayerName') || '';
let locksById = {}; // card_id -> player_name
let pendingAction = null;

async function fetchLocks() {
  const { data, error } = await supabaseClient.from('bingo_locks').select('*');
  if (error) {
    console.error('Impossible de récupérer les verrous:', error.message);
    return;
  }
  locksById = {};
  data.forEach(row => { locksById[row.card_id] = row.player_name; });
}

function subscribeToLocks() {
  supabaseClient
    .channel('bingo_locks_changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'bingo_locks' }, async () => {
      await fetchLocks();
      if (document.getElementById('entry-screen').style.display !== 'none') {
        renderEntryButtons();
      }
    })
    .subscribe();
}

function myLockedCardId() {
  const myName = playerName.trim().toLowerCase();
  if (!myName) return null;
  return Object.keys(locksById).find(id => locksById[id].trim().toLowerCase() === myName) || null;
}

function ensureName(callback) {
  if (playerName && playerName.trim()) { callback(); return; }
  pendingAction = callback;
  document.getElementById('nameInput').value = '';
  document.getElementById('nameModal').classList.add('show');
  setTimeout(() => document.getElementById('nameInput').focus(), 50);
}

function confirmName() {
  const input = document.getElementById('nameInput');
  const val = input.value.trim();
  if (!val) { input.focus(); return; }
  playerName = val;
  localStorage.setItem('bingoRentreePlayerName', val);
  document.getElementById('nameModal').classList.remove('show');
  renderEntryButtons();
  const action = pendingAction;
  pendingAction = null;
  if (action) action();
}

function changeName() {
  pendingAction = null;
  document.getElementById('nameInput').value = playerName;
  document.getElementById('nameModal').classList.add('show');
  setTimeout(() => document.getElementById('nameInput').focus(), 50);
}

function showInfoModal(message, title) {
  document.getElementById('infoModalTitle').textContent = title || 'Oups !';
  document.getElementById('infoModalMessage').textContent = message;
  document.getElementById('infoModal').classList.add('show');
}

function closeInfoModal() {
  document.getElementById('infoModal').classList.remove('show');
}

async function selectCard(id) {
  await fetchLocks();
  const lockedBy = locksById[id];
  const myName = playerName.trim().toLowerCase();

  if (lockedBy && lockedBy.trim().toLowerCase() === myName) {
    showCard(id);
    return;
  }

  if (lockedBy) {
    showInfoModal(`Cette grille est déjà verrouillée par ${lockedBy}.`);
    renderEntryButtons();
    return;
  }

  const myCardId = myLockedCardId();
  if (myCardId) {
    showInfoModal(`Tu joues déjà avec la grille #${myCardId}. Chaque joueur ne peut en choisir qu'une seule.`);
    return;
  }

  const { error } = await supabaseClient.from('bingo_locks').insert({ card_id: id, player_name: playerName.trim() });
  if (error) {
    showInfoModal("Cette grille vient d'être prise par quelqu'un d'autre. Choisis-en une autre.");
    await fetchLocks();
    renderEntryButtons();
    return;
  }

  await fetchLocks();
  showCard(id);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderEntryButtons() {
  const grid = document.getElementById('cardSelectGrid');
  grid.innerHTML = '';
  const myName = playerName.trim().toLowerCase();
  Object.keys(cards).forEach(id => {
    const btn = document.createElement('button');
    const lockedBy = locksById[id];
    const isMine = !!(lockedBy && lockedBy.trim().toLowerCase() === myName);
    btn.className = 'card-select-btn' + (lockedBy ? (isMine ? ' mine' : ' taken') : '');
    if (lockedBy) {
      btn.innerHTML = `${id}<span class="lock-owner">${isMine ? 'toi' : escapeHtml(lockedBy)}</span>`;
    } else {
      btn.textContent = id;
    }
    if (lockedBy && !isMine) {
      btn.disabled = true;
    } else {
      btn.onclick = () => ensureName(() => selectCard(id));
    }
    grid.appendChild(btn);
  });

  const label = document.getElementById('playerNameLabel');
  if (playerName) {
    label.innerHTML = `Tu joues en tant que <b>${escapeHtml(playerName)}</b> · <button onclick="changeName()">changer</button>`;
  } else {
    label.textContent = '';
  }
}

// Check URL param
async function checkUrlParam() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id || !cards[id]) return;
  ensureName(() => selectCard(id));
}

function showCard(id) {
  currentCard = id;
  checkedCells = new Set();
  hasWon = false;
  preKingKongState = null;

  document.getElementById('entry-screen').style.display = 'none';
  document.getElementById('bingo-screen').style.display = 'block';
  document.getElementById('bingo-screen').style.animation = 'none';
  requestAnimationFrame(() => {
    document.getElementById('bingo-screen').style.animation = 'slideUp 0.5s ease';
  });
  document.getElementById('cardIdLabel').textContent = `Grille #${id}`;
  document.getElementById('winBanner').classList.remove('show');

  // Update URL without reload
  try {
    const url = new URL(window.location);
    url.searchParams.set('id', id);
    history.replaceState(null, '', url);
  } catch(e) { /* iframe context */ }

  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('bingoGrid');
  grid.innerHTML = '';
  const items = cards[currentCard];

  items.forEach((text, i) => {
    const cell = document.createElement('div');
    cell.className = 'bingo-cell';
    cell.textContent = text;
    cell.dataset.index = i;
    if (checkedCells.has(i)) cell.classList.add('checked');
    cell.onclick = () => toggleCell(i, cell);
    grid.appendChild(cell);
  });

  grid.querySelectorAll('.bingo-cell').forEach(fitCellText);
}

// Shrinks a cell's font size until its text fits without overflowing
function fitCellText(cell) {
  const minFontSizePx = 8;
  cell.style.fontSize = '';
  let fontSize = parseFloat(getComputedStyle(cell).fontSize);
  let guard = 0;
  while (cell.scrollHeight > cell.clientHeight + 1 && fontSize > minFontSizePx && guard < 24) {
    fontSize -= 0.5;
    cell.style.fontSize = fontSize + 'px';
    guard++;
  }
}

function toggleCell(index, cellEl) {
  const isKingKong = cards[currentCard][index] === 'King Kong';

  if (isKingKong && !checkedCells.has(index)) {
    // Checking King Kong: remember the current state, then take over the whole grid
    preKingKongState = new Set(checkedCells);
    checkedCells = new Set(cards[currentCard].map((_, i) => i));
    renderGrid();
    triggerKingKongTakeover();
    checkWin();
    return;
  }

  if (isKingKong && checkedCells.has(index)) {
    // Unchecking King Kong: restore the grid exactly as it was before the takeover
    checkedCells = preKingKongState ? new Set(preKingKongState) : new Set();
    preKingKongState = null;
    hasWon = false;
    document.getElementById('winBanner').classList.remove('show');
    renderGrid();
    checkWin();
    return;
  }

  if (checkedCells.has(index)) {
    checkedCells.delete(index);
    cellEl.classList.remove('checked');
    cellEl.classList.remove('win-cell');
    hasWon = false;
    document.getElementById('winBanner').classList.remove('show');
    document.querySelectorAll('.bingo-cell').forEach(c => c.classList.remove('win-cell'));
    checkWin();
  } else {
    checkedCells.add(index);
    cellEl.classList.add('checked');
    cellEl.style.animation = 'none';
    requestAnimationFrame(() => { cellEl.style.animation = ''; });
    checkWin();
  }
}

function checkWin() {
  for (const line of winLines) {
    if (line.every(i => checkedCells.has(i))) {
      if (!hasWon) {
        hasWon = true;
        document.getElementById('winBanner').classList.add('show');
        launchConfetti();
      }
      line.forEach(i => {
        const cell = document.querySelector(`.bingo-cell[data-index="${i}"]`);
        if (cell) cell.classList.add('win-cell');
      });
    }
  }
}

function resetCard() {
  checkedCells = new Set();
  hasWon = false;
  preKingKongState = null;
  document.getElementById('winBanner').classList.remove('show');
  renderGrid();
}

function playGorillaRoar(delaySeconds) {
  setTimeout(() => {
    const audio = new Audio(KINGKONG_ROAR_SRC);
    audio.volume = 0.35;
    audio.play().catch(() => {});
  }, delaySeconds * 1000);
}

function triggerKingKongTakeover() {
  const overlay = document.createElement('div');
  overlay.className = 'kingkong-overlay';

  // Phase 1: a big, exaggerated stampede of small King Kongs sweeping across the screen
  const waveCount = 28;
  let waveHtml = '';
  for (let i = 0; i < waveCount; i++) {
    const topPct = (5 + Math.random() * 88).toFixed(1);
    const delay = (Math.random() * 2.2).toFixed(2);
    const duration = (2.4 + Math.random() * 1.4).toFixed(2);
    const size = (1.5 + Math.random() * 1.8).toFixed(2);
    waveHtml += `<span style="top:${topPct}%; font-size:${size}rem; animation-delay:${delay}s; animation-duration:${duration}s;">🦍</span>`;
  }

  // Phase 3: small King Kongs evenly placed around a circle, orbiting via the rotating parent
  const orbitCount = 8;
  const radius = Math.round(Math.min(window.innerWidth, window.innerHeight) * 0.32);
  let orbitHtml = '';
  for (let i = 0; i < orbitCount; i++) {
    const angle = (i / orbitCount) * Math.PI * 2;
    const x = Math.round(Math.cos(angle) * radius);
    const y = Math.round(Math.sin(angle) * radius);
    orbitHtml += `<div class="kingkong-orbit-item" style="transform: translate(${x}px, ${y}px);"><span>🦍</span></div>`;
  }

  overlay.innerHTML = `
    <div class="kingkong-stage">
      <div class="kingkong-wave">${waveHtml}</div>
      <div class="kingkong-big-wrap">
        <span class="kingkong-big">🦍</span>
        <span class="kingkong-text">KING KONG !</span>
      </div>
      <div class="kingkong-orbit-wrapper">${orbitHtml}</div>
    </div>
  `;

  document.body.appendChild(overlay);
  setTimeout(() => overlay.remove(), 7000);

  // Matches the big King Kong's landing (same delay as the card shake below)
  playGorillaRoar(1.8);

  // Shake the card right as the big King Kong lands
  setTimeout(() => {
    const card = document.querySelector('.bingo-card');
    if (card) {
      card.classList.remove('kingkong-shake');
      void card.offsetWidth;
      card.classList.add('kingkong-shake');
    }
  }, 1800);
}

function goBack() {
  document.getElementById('bingo-screen').style.display = 'none';
  document.getElementById('entry-screen').style.display = 'block';
  try {
    const url = new URL(window.location);
    url.searchParams.delete('id');
    history.replaceState(null, '', url);
  } catch(e) { /* iframe context */ }
  fetchLocks().then(renderEntryButtons);
}

function launchConfetti() {
  const container = document.getElementById('confettiContainer');
  const emojis = ['🥐', '☕', '📚', '✏️', '🍎', '🎒', '🥯', '📐'];
  for (let i = 0; i < 50; i++) {
    const confetti = document.createElement('div');
    confetti.className = 'confetti';
    confetti.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    confetti.style.left = Math.random() * 100 + '%';
    confetti.style.animationDelay = Math.random() * 1.5 + 's';
    confetti.style.animationDuration = (2 + Math.random() * 2) + 's';
    confetti.style.fontSize = (1.1 + Math.random() * 1.2) + 'rem';
    container.appendChild(confetti);
  }
  setTimeout(() => { container.innerHTML = ''; }, 4000);
}

// Init
(async () => {
  await buildEntryScreen();
  subscribeToLocks();
  await checkUrlParam();
})();
</script>
